name: Reusable Tests

on:
  workflow_call:
    inputs:
      pytest-targets:
        required: true
        type: string
      xvfb:
        required: false
        type: boolean
        default: false
      coverage-suffix:
        required: false
        type: string
        default: ""
        description: "Suffix for the coverage data file and artifact (e.g. ui / logic)."

jobs:
  pytest:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      PYTEST_TARGETS: ${{ inputs['pytest-targets'] }}
      COVERAGE_FILE: .coverage-${{ inputs.coverage-suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxkbcommon-x11-0

      - name: Run pytest under Xvfb
        if: ${{ inputs.xvfb }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" uv run --frozen --with pytest-cov pytest $PYTEST_TARGETS --cov=src/openwopan --cov-branch --cov-report= --cov-fail-under=0

      - name: Run pytest
        if: ${{ !inputs.xvfb }}
        run: uv run --frozen --with pytest-cov pytest $PYTEST_TARGETS --cov=src/openwopan --cov-branch --cov-report= --cov-fail-under=0

      - name: Upload coverage data
        if: ${{ inputs.coverage-suffix != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ inputs.coverage-suffix }}
          path: .coverage-${{ inputs.coverage-suffix }}
          include-hidden-files: true
          if-no-files-found: error
